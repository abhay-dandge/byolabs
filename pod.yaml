apiVersion: v1
kind: Pod
metadata:
  name: dind-gvisor
  annotations:
    # Forces GKE Autopilot to use the gVisor sandbox container runtime
    container.apps.gke.io/sandbox: gvisor
  labels:
    app: dind-gvisor
spec:
  containers:
    # 1. The Docker Daemon (Server)
    - name: dind-daemon
      image: docker:27-dind
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        # Explicitly ask for capabilities required by Docker inside gVisor
        capabilities:
          add:
            - SETUID
            - SETGID
      env:
        - name: DOCKER_TLS_CERTDIR
          value: "" # Disabling TLS since we communicate locally over a unix socket
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run

    # 2. The Client Container (e.g., CI Runner or App interacting with Docker)
    - name: docker-client
      image: docker:latest
      command: ["sleep", "infinity"]
      env:
        # Point the CLI to the shared Unix socket
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run

  volumes:
    # Shared memory volume for the Docker socket
    - name: docker-socket
      emptyDir: {}
