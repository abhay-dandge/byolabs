# ==============================================================================
# BYOLabs.in — Rootless Docker Playground Pod Specification (GKE Autopilot Native)
# Description: Multi-container Pod spec running Docker Daemon inside user namespace (UID 1000)
#              without requiring privileged mode (securityContext.privileged: false).
#              Communicates via shared Unix socket at unix:///run/user/1000/docker.sock
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: rootless-dind
  labels:
    app: rootless-dind
spec:
  securityContext:
    # Rootless DinD uses UID/GID 1000 (non-root) internally
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    # 1. The Rootless Docker Daemon (Server)
    - name: dind-daemon
      image: docker:dind-rootless
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        privileged: false
        seccompProfile:
          type: Unconfined
      env:
        - name: DOCKER_TLS_CERTDIR
          value: "" # Disabling TLS since we communicate locally over a unix socket
        - name: DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS
          value: "--net=slirp4netns --disable-host-loopback"
      volumeMounts:
        - name: docker-socket
          mountPath: /run/user/1000
        - name: docker-storage
          mountPath: /home/rootless/.local/share/docker
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1.5Gi"

    # 2. The Client Container (Interactive Terminal & Docker CLI Runner)
    - name: docker-client
      image: docker:latest
      command: ["sleep", "infinity"]
      env:
        # Point the CLI to the shared rootless Unix socket
        - name: DOCKER_HOST
          value: unix:///run/user/1000/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /run/user/1000
      stdin: true
      tty: true
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

  volumes:
    # Shared memory volume for the Docker socket
    - name: docker-socket
      emptyDir: {}
    # Ephemeral volume to hold images/layers inside the pod
    - name: docker-storage
      emptyDir: {}
  restartPolicy: Never
