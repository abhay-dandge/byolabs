apiVersion: v1
kind: Pod
metadata:
  name: lab-sample-pod
  namespace: lab-session-7f8d29c4
  labels:
    app: byolabs-lab
    session-id: lab-7f8d29c4
    user-id: usr-001
    lab-type: ubuntu-playground
spec:
  containers:
    - name: lab-container
      image: ubuntu:24.04
      command: ["/bin/bash"]
      stdin: true
      tty: true
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
      securityContext:
        allowPrivilegeEscalation: false
  restartPolicy: Never
