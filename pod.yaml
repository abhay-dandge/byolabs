apiVersion: v1
kind: Pod
metadata:
  name: rootless-dind
  labels:
    app: rootless-dind
spec:
  securityContext:
    # Rootless DinD uses UID/GID 1000 (non-root) internally
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    # 1. The Rootless Docker Daemon (Server)
    - name: dind-daemon
      image: docker:dind-rootless
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        privileged: false
        seccompProfile:
          type: Unconfined
      env:
        - name: DOCKER_TLS_CERTDIR
          value: "" # Disabling TLS since we communicate locally over a unix socket
        - name: DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS
          value: "--net=slirp4netns --disable-host-loopback"
      volumeMounts:
        - name: docker-socket
          mountPath: /run/user/1000
        - name: docker-storage
          mountPath: /home/rootless/.local/share/docker

    # 2. The Client Container (e.g., CI Runner or App interacting with Docker)
    - name: docker-client
      image: docker:latest
      command: ["sleep", "infinity"]
      env:
        # Point the CLI to the shared rootless Unix socket
        - name: DOCKER_HOST
          value: unix:///run/user/1000/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /run/user/1000

  volumes:
    # Shared memory volume for the Docker socket
    - name: docker-socket
      emptyDir: {}
    # Ephemeral volume to hold images/layers inside the pod
    - name: docker-storage
      emptyDir: {}


