# ==============================================================================
# BYOLabs.in — Official GKE Autopilot DinD Pod Specification (gVisor Sandbox)
# Description: Official GKE Autopilot template for running nested Docker containers (DinD)
#              using GKE Sandbox (gVisor) annotation and SETUID/SETGID capabilities.
#              Satisfies GKE Warden security rules (privileged: false).
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: dind-gvisor
  annotations:
    container.apps.gke.io/sandbox: gvisor
  labels:
    app: dind-gvisor
spec:
  containers:
    # 1. The Docker Daemon Container (Server running in gVisor Sandbox)
    - name: dind-daemon
      image: docker:27-dind
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          add:
            - SETUID
            - SETGID
      env:
        - name: DOCKER_TLS_CERTDIR
          value: "" # Disabling TLS since we communicate locally over a unix socket
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1.5Gi"

    # 2. The Client Container (Interactive Terminal & Docker CLI Runner)
    - name: docker-client
      image: docker:latest
      command: ["sleep", "infinity"]
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run
      stdin: true
      tty: true
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

  volumes:
    # Shared memory volume for the Docker socket
    - name: docker-socket
      emptyDir: {}
  restartPolicy: Never
